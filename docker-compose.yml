services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./ml:/app/ml
      - ./backend:/app/backend
    environment:
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - BATCH_JOB_TTL=3600
      # MongoDB — uncomment when ready
      # - MONGO_URI=mongodb://mongo:27017
      # - MONGO_DB=synthid_detector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB — uncomment when ready
